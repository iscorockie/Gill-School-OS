name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, then run business-rule smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (Next.js compile + static generation)
        run: npm run build
      - name: Start server
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/state > /dev/null; then
              echo "Server ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to start within 60s"; cat server.log; exit 1
      - name: Run smoke tests (50 business-rule checks)
        run: node scripts/smoke-test.mjs
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
